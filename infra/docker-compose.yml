services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_FQDN: ${API_FQDN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${ECR_REGISTRY}/sidoc-ai-marketing-staging-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /run/sidoc-ai/.env
    environment:
      PROJECT_NAME: sidoc-ai-marketing
    expose:
      - "${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${BACKEND_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-server:
    image: ${ECR_REGISTRY}/sidoc-ai-marketing-staging-mcp-server:${MCP_SERVER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /run/sidoc-ai/.env
    expose:
      - "${MCP_SERVER_PORT}"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
