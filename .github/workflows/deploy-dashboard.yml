name: deploy-dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/observability/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  DASHBOARD_URL: https://marketing.stg.sidocsa.com/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: 1.3.12

      - name: build dashboard
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENV: staging
        run: |
          cd apps/dashboard
          bun install --frozen-lockfile
          bun run build

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sync hashed assets (immutable cache)
        run: |
          aws s3 sync apps/dashboard/dist/ "s3://${{ vars.DASHBOARD_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: upload index.html (no-cache)
        run: |
          aws s3 cp apps/dashboard/dist/index.html "s3://${{ vars.DASHBOARD_BUCKET }}/index.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: invalidate cloudfront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DIST_ID }}" \
            --paths "/index.html" "/"

      - name: smoke check
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${DASHBOARD_URL}" || echo 000)
            echo "[$i] dashboard => ${CODE}"
            if [ "${CODE}" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "dashboard did not return 200"
          exit 1
