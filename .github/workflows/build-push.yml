name: build-push

on:
  push:
    branches: [staging]
    paths:
      - "apps/backend/**"
      - "apps/mcp-server/**"
      - "packages/observability/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/observability/**'
            mcp_server:
              - 'apps/mcp-server/**'

  build-backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/sidoc-ai-marketing-staging-backend:${{ github.sha }}

  build-mcp-server:
    needs: detect
    if: needs.detect.outputs.mcp_server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/sidoc-ai-marketing-staging-mcp-server:${{ github.sha }}
