name: ci

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            test_cmd: bun test
            typecheck_cmd: bun run typecheck
          - app: mcp-server
            test_cmd: bun test
            typecheck_cmd: bun run type-check
          - app: dashboard
            test_cmd: bun run test:run
            typecheck_cmd: bun run type-check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: 1.3.12
      - name: install
        run: cd apps/${{ matrix.app }} && bun install --frozen-lockfile
      - name: typecheck
        run: cd apps/${{ matrix.app }} && ${{ matrix.typecheck_cmd }}
      - name: test
        run: cd apps/${{ matrix.app }} && ${{ matrix.test_cmd }}

  dashboard-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: 1.3.12
      - name: build dashboard
        run: |
          cd apps/dashboard
          bun install --frozen-lockfile
          VITE_API_URL="${{ vars.VITE_API_URL }}" VITE_ENV=staging bun run build
      - name: scan dist for leaked secrets
        run: |
          if grep -rE 'sk-[a-zA-Z0-9_-]{20,}|secret_[a-zA-Z0-9]{16,}|JWT_SECRET|API_SECRET' apps/dashboard/dist/; then
            echo "::error::Dashboard bundle contains a string that looks like a secret"
            exit 1
          fi
